<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Crashing Inc - Discord Server</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <i class="fa fa-ravelry" aria-hidden="true"></i>
            </div>
            <h1 class="glitch" data-text="CRASHING INC">CRASHING INC</h1>
            <p class="subtitle">Join the Ultimate Discord Community</p>
        </header>
        
        <main>
            <div class="member-count">
                <span class="count-label">Online Members:</span>
                <span class="count-number" id="memberCount">Loading...</span>
            </div>
            
            <div class="cta-section">
                <p class="join-text">Ready to join the chaos?</p>
                <a href="https://discord.gg/crashing" target="_blank" class="join-button">
                    <span class="button-text">JOIN DISCORD</span>
                    <span class="button-glow"></span>
                </a>
            </div>
            
            <div class="team-section">
                <div class="team-role">
                    <span class="role-title">Active Chat</span>
                </div>
                <div class="team-role">
                    <span class="role-title">Founded by Femsy</span>
                </div>
                <div class="team-role">
                    <span class="role-title">New Users All Day</span>
                </div>
            </div>
            
            <div class="team-section">
                <div class="team-role">
                    <span class="role-title">Lead Dev</span>
                    <span class="role-name">swiped</span>
                </div>
                <div class="team-role">
                    <span class="role-title">Dev</span>
                    <span class="role-name">syntax</span>
                </div>
            </div>
            
            <div class="tagline">
                <div class="tagline-icon">
                    <i class="fa fa-power-off" aria-hidden="true"></i>
                </div>
                <p class="tagline-text">NO REALM IS SAFE</p>
                <p class="tagline-date">EST. 2022-2026</p>
            </div>
        </main>
    </div>
    
    <script src="security.js"></script>
    <script src="script.js"></script>
</body>
</html>
